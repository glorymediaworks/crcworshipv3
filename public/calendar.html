<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pick a date · CRC Worship</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Noto+Sans+Tamil:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head><body>
<div class="top"><div class="logo"><i>CRC</i> Worship</div><div class="sp"></div><button class="btn sm ghost" id="out">Sign out</button></div>
<div class="wrap">
  <div class="cal-head">
    <h2 id="mt"></h2>
    <button class="btn sm" id="pv">‹</button><button class="btn sm" id="td">Today</button><button class="btn sm" id="nx">›</button>
  </div>
  <p class="lead">Choose the date you’re planning. Each date has its own session — songs and images you add there stay with that day only.</p>
  <div class="grid7" id="dows"></div>
  <div class="grid7" id="g" style="margin-top:8px"></div>
</div>
<script src="js/config.js"></script><script src="js/core.js"></script>
<script>
if (!CRC.guard()) throw 0;
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
let cur = new Date(); cur.setDate(1);
dows.innerHTML = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div class="dow">${d}</div>`).join('');
async function draw() {
  mt.textContent = `${MONTHS[cur.getMonth()]} ${cur.getFullYear()}`;
  const ym = CRC.dateKey(cur).slice(0, 7), today = CRC.dateKey(new Date());
  let map = {};
  try { (await CRC.api('/api/sessions?month=' + ym)).sessions.forEach(s => map[s.date] = s); } catch (e) { console.warn(e); }
  const start = new Date(cur); start.setDate(1 - cur.getDay());
  let html = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const k = CRC.dateKey(d), s = map[k], out = d.getMonth() !== cur.getMonth();
    if (i >= 35 && out) break;
    html += `<button class="day${out ? ' out' : ''}${k === today ? ' today' : ''}${s ? ' has' : ''}" data-d="${k}">
      <span class="n">${d.getDate()}</span>${s ? `<span class="tag">${CRC.esc(s.title || 'Service')} · ${s.count}</span>` : ''}</button>`;
  }
  g.innerHTML = html;
}
g.addEventListener('click', (e) => { const b = e.target.closest('.day'); if (b) location.href = 'dashboard.html?date=' + b.dataset.d; });
pv.onclick = () => { cur.setMonth(cur.getMonth() - 1); draw(); };
nx.onclick = () => { cur.setMonth(cur.getMonth() + 1); draw(); };
td.onclick = () => { cur = new Date(); cur.setDate(1); draw(); };
out.onclick = CRC.logout;
draw();
</script></body></html>
