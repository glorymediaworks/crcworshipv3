<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Church screen · CRC Worship</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Noto+Sans+Tamil:wght@500;600;700&family=Noto+Serif+Tamil:wght@500;700&family=Hind+Madurai:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head><body class="screenpage">
<div id="st"></div>
<div class="hintbar" id="hint">Press F for full screen · this window mirrors the dashboard</div>
<script src="js/config.js"></script><script src="js/core.js"></script>
<script>
// Church screen: receives ready-to-draw slides from the dashboard (same browser). No data of its own.
const ch = new BroadcastChannel('crc-live');
let last = { screen: null, settings: CRC.DEFAULTS };
const draw = () => CRC.renderScreen(st, last);
ch.onmessage = (e) => { if (e.data && e.data.t === 'show') { last = e.data.payload; draw(); } };
ch.postMessage({ t: 'hello' });
addEventListener('resize', draw);
addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); });
setTimeout(() => hint.style.opacity = 0, 5000);
document.fonts.ready.then(draw); draw();
</script></body></html>
